# cookieSecret diambil dari env STREAMLIT_SERVER_COOKIE_SECRET (lihat .env)
[server]
# ./static disajikan di /app/static (font IBM Plex Sans di-host sendiri, TV tidak butuh internet)
enableStaticServing = true
headless = true
maxUploadSize = 100
enableXsrfProtection = true
# CORS aktif: batasi WebSocket lintas origin. Di production isi origin domain Anda, mis.
# corsAllowedOrigins = ["https://dashboard.example.co.id"]
enableCORS = true

[client]
showErrorDetails = false
# "viewer": the ⋮ menu keeps Settings → theme (Light / Dark / System) for every user
toolbarMode = "viewer"

[logger]
level = "info"
messageFormat = "%(asctime)s %(levelname)s %(name)s: %(message)s"

[browser]
gatherUsageStats = false

[theme]
# shared by both modes; colours per mode below (tokens in core/theme.py). Users switch in ⋮ → Settings.
chartCategoricalColors = ["#F2C230", "#4E9BD8", "#4FC1A6", "#C08BE0", "#9CC7EA", "#C98DA8", "#A7D38B", "#F08A3C"]
orangeColor = "#F08A3C"
blueColor = "#4E9BD8"
font = "ibm-plex-sans"
codeFont = "ibm-plex-sans"
headingFont = "ibm-plex-sans"


[theme.dark]
# haul road: asphalt, chalk text, hi-vis yellow
primaryColor = "#F2C230"
backgroundColor = "#141517"
secondaryBackgroundColor = "#1C1E21"
textColor = "#EDEAE3"
borderColor = "#2C2F33"
yellowColor = "#F2C230"
grayColor = "#9C9A93"

[theme.light]
# paper and concrete; primary is a darker ochre so white button text stays readable
primaryColor = "#9A6B00"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#ECEAE4"
textColor = "#1E1F21"
borderColor = "#D8D5CD"
yellowColor = "#B88600"
grayColor = "#686660"

[[theme.fontFaces]]
family = "ibm-plex-sans"
url = "app/static/fonts/ibm-plex-sans-400.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "ibm-plex-sans"
url = "app/static/fonts/ibm-plex-sans-500.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "ibm-plex-sans"
url = "app/static/fonts/ibm-plex-sans-600.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "ibm-plex-sans"
url = "app/static/fonts/ibm-plex-sans-700.woff2"
weight = 700
style = "normal"
