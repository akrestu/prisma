# Jalankan dari folder eq_dashboard:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# every container keeps at most 5 × 10 MB of logs: without this, Docker logs grow until the disk is full
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  db:
    logging: *logging
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: eq_dashboard
      POSTGRES_USER: eq_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eq_app -d eq_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 10
    # tidak ada 'ports': database hanya bisa diakses dari jaringan internal Docker
  app:
    logging: *logging
    build: {context: .., dockerfile: deploy/Dockerfile}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}   # wait for Postgres before running migrations
    environment:
      DATABASE_URL: postgresql+psycopg://eq_app:${POSTGRES_PASSWORD}@db:5432/eq_dashboard
      AUTH_COOKIE_KEY: ${AUTH_COOKIE_KEY}
      TV_CODE_KEY: ${TV_CODE_KEY:-}
      STREAMLIT_SERVER_COOKIE_SECRET: ${STREAMLIT_SERVER_COOKIE_SECRET}
  caddy:
    logging: *logging
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
volumes: {pgdata: {}, caddy_data: {}, caddy_config: {}}
